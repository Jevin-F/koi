[package]
name = "koi-app"
description = "Koi desktop application."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "koi"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
koi-core.workspace = true
koi-term.workspace = true
block2.workspace = true
notify.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true
rust-i18n.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
toml.workspace = true

[lints]
workspace = true
