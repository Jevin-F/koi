[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1" }
koi-core = { path = "crates/koi-core" }
koi-term = { path = "crates/koi-term" }
notify = "8"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
] }
portable-pty = "0.9"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# GPUI is unusably slow without optimization; optimize dependencies only so
# that our own crates still build quickly in debug.
[profile.dev.package."*"]
opt-level = 3

